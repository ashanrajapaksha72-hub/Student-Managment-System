<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All the Students</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../Student Management/CSS/findfirst.css">
</head>

<body>
    <div class="container py-5">

        <a href="API.html" class="text-decoration-none text-primary">
            <i class="bi bi-arrow-left"></i> Go Back
        </a>

        <div class="results-card mt-5">

            <div class="d-flex justify-content-between align-items-center mb-4">


                <h3>Search Results</h3>

                <span class="badge bg-primary fs-6" id="resultCount">
                    0 Results Found
                </span>

            </div>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-primary">

                        <tr>
                            <th>SID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>City</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Guardian</th>
                        </tr>

                    </thead>
                    <button id="toggleBtn" class="btn btn-secondary mb-3">Hide Results</button>
                    <tbody id="resultBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            //hide and show using jquery
            $('#toggleBtn').on('click', function () {
                $('#resultBody').toggle();
                if ($(this).text() === 'Hide Results') {
                    $(this).text('Show Results');
                } else {
                    $(this).text('Hide Results');
                }
            });

            $.ajax({
                url: `http://localhost:3000/students`,
                method: 'GET',
                success: function (res) {
                    let output = "";

                    res.data.forEach(student => {
                        output += `
                    <tr onclick="viewStudent(${student.SID})" style="cursor:pointer;">
                        <td>${student.SID}</td>
                        <td>${student.FirstName}</td>
                        <td>${student.LastName}</td>
                        <td>${student.NearCity}</td>
                        <td>${student.Email}</td>
                        <td>${student.Course}</td>
                        <td>${student.Guardian}</td>
                    </tr>`;
                    });

                    document.getElementById("resultBody").innerHTML = output;
                    document.getElementById("resultCount").innerHTML = res.count + " Results Found";
                },
                error: function () {
                    document.getElementById("resultBody").innerHTML =
                        `<tr><td colspan="7" class="text-center text-danger">
                    Failed to load students. Make sure server is running.
                </td></tr>`;
                }
            });
        });
        function viewStudent(sid) {
                localStorage.setItem("selectedSID", sid);
                window.location.href = "detail.html";
            }
    </script>

</body>

</html>
