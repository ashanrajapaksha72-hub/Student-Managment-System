<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Student by First Name</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../Student Management/CSS/findfirst.css">
</head>

<body>
    <div class="container py-5">

        <a href="API.html" class="text-decoration-none text-primary">
                <i class="bi bi-arrow-left"></i>  Go Back
            </a>

        <!-- Search Section -->
        <div class="search-card">

            <div class="row align-items-center">

                <div class="col-lg-8">
                    <h1 class="mb-3">Find Student by First Name</h1>
                    <p class="text-muted">
                        Search students using their first name.
                    </p>

                    <div class="input-group mt-4">

                        <input type="text" id="firstName" class="form-control form-control-lg"
                            placeholder="Enter First Name">

                        <button class="btn btn-primary px-4" onclick="searchStudent()">
                            Search
                        </button>

                    </div>

                </div>

                <div class="col-lg-4 text-center">

                    <div class="search-icon">
                        <i class="bi bi-person-fill"></i>
                    </div>

                </div>

            </div>

        </div>

        <!-- Results Section -->

        <div class="results-card">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h3>Search Results</h3>

                <span class="badge bg-primary fs-6" id="resultCount">
                    0 Results Found
                </span>

            </div>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-primary">

                        <tr>
                            <th>SID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>City</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Guardian</th>
                        </tr>

                    </thead>

                    <tbody id="resultBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
    function searchStudent() {
    let firstName = document.getElementById("firstName").value.trim();

    if (!firstName) {
        alert("Please enter a first name.");
        return;
    }

    $.ajax({
        url: `http://localhost:3000/students/firstname/${firstName}`,
        method: 'GET',
        success: function (res) {
            let output = "";

            res.data.forEach(student => {
                output += `
                <tr onclick="viewStudent(${student.SID})" style="cursor:pointer;">
                    <td>${student.SID}</td>
                    <td>${student.FirstName}</td>
                    <td>${student.LastName}</td>
                    <td>${student.NearCity}</td>
                    <td>${student.Email}</td>
                    <td>${student.Course}</td>
                    <td>${student.Guardian}</td>
                </tr>`;
            });

            $('#resultBody').html(output);
            $('#resultCount').html(res.count + " Results Found");
        },
        error: function (xhr) {
            document.getElementById("resultBody").innerHTML =
                `<tr><td colspan="7" class="text-center text-danger">
                ${xhr.responseJSON?.message || "No students found."}
            </td></tr>`;
            document.getElementById("resultCount").innerHTML = "0 Results Found";
        }
    });
}

function viewStudent(sid) {
    localStorage.setItem("selectedSID", sid);
    window.location.href = "detail.html";
}
</script>
</body>

</html>
