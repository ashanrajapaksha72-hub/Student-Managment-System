<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student by SID</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../Student Management/CSS/update.css">
</head>

<body>
    <div class="container py-5">

        <a href="API.html" class="text-decoration-none text-primary">
                <i class="bi bi-arrow-left"></i>  Go Back
            </a>

        <!-- Header -->

        <div class="header-section">

            <div>
                <h1 class="page-title">
                    Update Student by SID
                </h1>

                <p class="page-subtitle">
                    Search for a student using their SID and update their details.
                </p>
            </div>

        </div>

        <!-- Main Card -->

        <div class="main-card">

            <!-- Search Section -->

            <h3 class="section-title">
                1. Search Student
            </h3>

            <div class="row mb-5">

                <div class="col-md-9">

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person-vcard"></i>
                        </span>

                        <input type="text" class="form-control" id="searchSid" placeholder="Enter Student ID (SID)">

                    </div>

                </div>

                <div class="col-md-3">

                    <button class="btn btn-primary w-100 search-btn" onclick="searchStudent()">
                        <i class="bi bi-search"></i>
                        Search
                    </button>

                </div>

            </div>
            <div id="searchMsg" class="mt-3"></div>
            <hr>

            <!-- Student Details -->

            <h3 class="section-title mt-4">
                2. Student Details
            </h3>

            <form>
                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Student ID</label>
                        <input type="number" id="sid" class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" id="firstname" class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" id="lastname" class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nearest City</label>
                        <input type="text" id="city" class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Guardian Name</label>
                        <input type="text" id="guardian" class="form-control">
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label">Course</label>

                        <select id="course" class="form-select">
                            <option>Foundation</option>
                            <option>HND</option>
                            <option>Masters Degree</option>
                            <option>Top-Up Degree</option>
                        </select>
                    </div>

                </div>
                <div class="mt-4">

                    <button type="button" class="btn btn-success action-btn" onclick="updateStudent()">
                        <i class="bi bi-check-circle"></i>
                        Update Student
                    </button>

                    <button type="reset" class="btn btn-outline-secondary action-btn">
                        <i class="bi bi-arrow-clockwise"></i>
                        Reset
                    </button>

                </div>

            </form>

        </div>

    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>

        // ── 1. Search and populate form ──
        function searchStudent() {
            let sid = document.getElementById("searchSid").value.trim();

            if (!sid) {
                alert("Please enter a Student ID.");
                return;
            }

            $.ajax({
                url: `http://localhost:3000/students/sid/${sid}`,
                method: 'GET',
                success: function (res) {
                    let s = res.data;

                    // Populate form fields with current data
                    document.getElementById("sid").value = s.SID;
                    document.getElementById("firstname").value = s.FirstName;
                    document.getElementById("lastname").value = s.LastName;
                    document.getElementById("email").value = s.Email;
                    document.getElementById("city").value = s.NearCity;
                    document.getElementById("guardian").value = s.Guardian;
                    document.getElementById("course").value = s.Course[0];

                    // Show success message
                    document.getElementById("searchMsg").innerHTML =
                        `<div class="alert alert-success">
                        Student <strong>${s.FirstName} ${s.LastName}</strong> found. Edit and click Update.
                    </div>`;
                },
                error: function (xhr) {
                    document.getElementById("searchMsg").innerHTML =
                        `<div class="alert alert-danger">
                        ${xhr.responseJSON?.message || "No student found with that SID."}
                    </div>`;
                }
            });
        }

        // ── 2. Update student ──
        function updateStudent() {
            let sid = document.getElementById("sid").value.trim();

            if (!sid) {
                alert("Please search for a student first.");
                return;
            }

            let updatedData = {
                FirstName: document.getElementById("firstname").value.trim(),
                LastName: document.getElementById("lastname").value.trim(),
                Email: document.getElementById("email").value.trim(),
                NearCity: document.getElementById("city").value.trim(),
                Guardian: document.getElementById("guardian").value.trim(),
                Course: [document.getElementById("course").value]
            };

            $.ajax({
                url: `http://localhost:3000/students/sid/${sid}`,
                method: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify(updatedData),
                success: function (res) {
                    document.getElementById("searchMsg").innerHTML =
                        `<div class="alert alert-success">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        Student <strong>${res.data.FirstName} ${res.data.LastName}</strong> updated successfully!
                    </div>`;
                },
                error: function (xhr) {
                    document.getElementById("searchMsg").innerHTML =
                        `<div class="alert alert-danger">
                        ${xhr.responseJSON?.message || "Failed to update student."}
                    </div>`;
                }
            });
        }

    </script>
</body>

</html>
