<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student by SID</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../Student Management/CSS/update.css">
</head>

<body>

    <div class="container py-5">

        <a href="API.html" class="text-decoration-none text-primary">
                <i class="bi bi-arrow-left"></i>  Go Back
            </a>

        <!-- Header -->
        <div class="header-section">
            <div>
                <h1 class="page-title">Delete Student by SID</h1>
                <p class="page-subtitle">Search for a student using their SID and delete their record.</p>
            </div>
        </div>

        <!-- Main Card -->
        <div class="main-card">

            <!-- Search Section -->
            <h3 class="section-title">1. Search Student</h3>

            <div class="row mb-3">

                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person-vcard"></i>
                        </span>
                        <input type="text" class="form-control" id="searchSid" placeholder="Enter Student ID (SID)">
                    </div>
                </div>

                <div class="col-md-3">
                    <button class="btn btn-primary w-100 search-btn" onclick="searchStudent()">
                        <i class="bi bi-search"></i> Search
                    </button>
                </div>

            </div>

            <div id="searchMsg" class="mt-3"></div>

            <hr>

            <!-- Student Details -->
            <h3 class="section-title mt-4">2. Student Details</h3>

            <div id="studentDetails" style="display:none;">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Student ID</label>
                        <input type="number" id="sid" class="form-control" readonly>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" id="firstname" class="form-control" readonly>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" id="lastname" class="form-control" readonly>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-control" readonly>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nearest City</label>
                        <input type="text" id="city" class="form-control" readonly>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Guardian Name</label>
                        <input type="text" id="guardian" class="form-control" readonly>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label">Course</label>
                        <input type="text" id="course" class="form-control" readonly>
                    </div>

                </div>

                <div class="mt-4">
                    <button type="button" class="btn btn-danger action-btn" onclick="deleteStudent()">
                        <i class="bi bi-trash-fill"></i> Delete Student
                    </button>
                    <button type="button" class="btn btn-outline-secondary action-btn" onclick="clearForm()">
                        <i class="bi bi-arrow-clockwise"></i> Clear
                    </button>
                </div>

            </div>

            <!-- placeholder when no student loaded -->
            <div id="noStudent" class="text-center py-4 text-muted">
                <i class="bi bi-person-x fs-1"></i>
                <p class="mt-2">Search for a student to see their details here.</p>
            </div>

        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>

        // ── 1. Search student by SID ──
        function searchStudent() {
            let sid = document.getElementById("searchSid").value.trim();

            if (!sid) {
                alert("Please enter a Student ID.");
                return;
            }

            $.ajax({
                url: `http://localhost:3000/students/sid/${sid}`,
                method: 'GET',
                success: function (res) {
                    let s = res.data;

                    // Populate fields (all readonly — just for display)
                    document.getElementById("sid").value       = s.SID;
                    document.getElementById("firstname").value = s.FirstName;
                    document.getElementById("lastname").value  = s.LastName;
                    document.getElementById("email").value     = s.Email;
                    document.getElementById("city").value      = s.NearCity;
                    document.getElementById("guardian").value  = s.Guardian;
                    document.getElementById("course").value = Array.isArray(s.Course) ? s.Course.join(', ') : s.Course;

                    // Show student details section
                    document.getElementById("studentDetails").style.display = "block";
                    document.getElementById("noStudent").style.display      = "none";

                    document.getElementById("searchMsg").innerHTML =
                        `<div class="alert alert-warning">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            Student <strong>${s.FirstName} ${s.LastName}</strong> found.
                            Click <strong>Delete Student</strong> to permanently remove this record.
                        </div>`;
                },
                error: function (xhr) {
                    document.getElementById("searchMsg").innerHTML =
                        `<div class="alert alert-danger">
                            <i class="bi bi-exclamation-circle-fill me-2"></i>
                            ${xhr.responseJSON?.message || "No student found with that SID."}
                        </div>`;

                    document.getElementById("studentDetails").style.display = "none";
                    document.getElementById("noStudent").style.display      = "block";
                }
            });
        }

        // ── 2. Delete student ──
        function deleteStudent() {
            let sid  = document.getElementById("sid").value.trim();
            let name = document.getElementById("firstname").value + " " + document.getElementById("lastname").value;

            if (!confirm(`Are you sure you want to delete ${name}? This cannot be undone.`)) {
                return;
            }

            $.ajax({
                url: `http://localhost:3000/students/sid/${sid}`,
                method: 'DELETE',
                success: function (res) {
                    document.getElementById("searchMsg").innerHTML =
                        `<div class="alert alert-success">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            Student <strong>${name}</strong> (SID: ${sid}) deleted successfully.
                        </div>`;

                    // Hide student details after deletion
                    document.getElementById("studentDetails").style.display = "none";
                    document.getElementById("noStudent").style.display      = "block";
                    document.getElementById("searchSid").value              = "";
                },
                error: function (xhr) {
                    document.getElementById("searchMsg").innerHTML =
                        `<div class="alert alert-danger">
                            <i class="bi bi-exclamation-circle-fill me-2"></i>
                            ${xhr.responseJSON?.message || "Failed to delete student."}
                        </div>`;
                }
            });
        }

        // ── 3. Clear form ──
        function clearForm() {
            document.getElementById("searchSid").value         = "";
            document.getElementById("searchMsg").innerHTML     = "";
            document.getElementById("studentDetails").style.display = "none";
            document.getElementById("noStudent").style.display      = "block";
        }

        // Allow Enter key to search
        document.getElementById("searchSid").addEventListener("keypress", function (e) {
            if (e.key === "Enter") searchStudent();
        });

    </script>
</body>

</html>
