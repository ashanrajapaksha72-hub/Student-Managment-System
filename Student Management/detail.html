<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../Student Management/CSS/detail.css">
</head>

<body>
    <div class="container py-5">

        <!-- PROFILE CARD -->
        <div class="profile-card">

            <a href="API.html" class="back-btn">
                <i class="bi bi-arrow-left"></i>
                Go Back
            </a>

            <div class="row align-items-center mt-4">

                <div class="col-lg-3 text-center">
                    <div class="profile-image">
                        <i class="bi bi-person-fill"></i>
                    </div>
                </div>

                <div class="col-lg-9">

                    <h1 class="fw-bold mb-3">
                        Student Details
                    </h1>

                    <p class="text-muted">
                        View complete information about the student.
                    </p>

                    <div class="d-flex gap-3 flex-wrap">

                        <span class="badge-id">
                            SID:
                            <span id="sid"></span>
                        </span>

                        <span class="badge-status">
                            Enrolled
                        </span>

                    </div>

                </div>

            </div>

        </div>
        <div class="info-card mt-4">

            <h3 class="section-title">
                <i class="bi bi-person-badge-fill"></i>
                Personal Information
            </h3>

            <div class="row">

                <!-- First Name -->
                <div class="col-lg-4">
                    <div class="info-item">
                        <div class="info-icon">
                            <i class="bi bi-person"></i>
                        </div>

                        <div>
                            <label>First Name</label>
                            <span id="firstName"></span>
                        </div>
                    </div>
                </div>

                <!-- Last Name -->
                <div class="col-lg-4">
                    <div class="info-item">
                        <div class="info-icon">
                            <i class="bi bi-person-vcard"></i>
                        </div>

                        <div>
                            <label>Last Name</label>
                            <span id="lastName"></span>
                        </div>
                    </div>
                </div>

                <!-- Guardian -->
                <div class="col-lg-4">
                    <div class="info-item">
                        <div class="info-icon">
                            <i class="bi bi-people"></i>
                        </div>

                        <div>
                            <label>Guardian</label>
                            <span id="guardian"></span>
                        </div>
                    </div>
                </div>

                <!-- Email -->
                <div class="col-lg-4">
                    <div class="info-item">
                        <div class="info-icon">
                            <i class="bi bi-envelope"></i>
                        </div>

                        <div>
                            <label>Email</label>
                            <span id="email"></span>
                        </div>
                    </div>
                </div>

                <!-- Phone -->
                <div class="col-lg-4">
                    <div class="info-item">
                        <div class="info-icon">
                            <i class="bi bi-telephone"></i>
                        </div>

                        <div>
                            <label>Phone</label>
                            <span id="phone"></span>
                        </div>
                    </div>
                </div>

                <!-- Guardian Phone -->
                <div class="col-lg-4">
                    <div class="info-item">
                        <div class="info-icon">
                            <i class="bi bi-telephone-fill"></i>
                        </div>

                        <div>
                            <label>Guardian Phone</label>
                            <span id="guardianPhone"></span>
                        </div>
                    </div>
                </div>

                <!-- Date of Birth -->
                <div class="col-lg-4">
                    <div class="info-item">
                        <div class="info-icon">
                            <i class="bi bi-calendar-date"></i>
                        </div>

                        <div>
                            <label>Date Of Birth</label>
                            <span id="dob"></span>
                        </div>
                    </div>
                </div>

                <!-- Gender -->
                <div class="col-lg-4">
                    <div class="info-item">
                        <div class="info-icon">
                            <i class="bi bi-gender-ambiguous"></i>
                        </div>

                        <div>
                            <label>Gender</label>
                            <span id="gender"></span>
                        </div>
                    </div>
                </div>

                <!-- Near City -->
                <div class="col-lg-4">
                    <div class="info-item">
                        <div class="info-icon">
                            <i class="bi bi-buildings"></i>
                        </div>

                        <div>
                            <label>Near City</label>
                            <span id="city"></span>
                        </div>
                    </div>
                </div>

                <!-- Address -->
                <div class="col-lg-6">
                    <div class="info-item">
                        <div class="info-icon">
                            <i class="bi bi-geo-alt"></i>
                        </div>

                        <div>
                            <label>Address</label>
                            <span id="address"></span>
                        </div>
                    </div>
                </div>

                <!-- Course -->
                <div class="col-lg-3">
                    <div class="info-item">
                        <div class="info-icon">
                            <i class="bi bi-mortarboard"></i>
                        </div>

                        <div>
                            <label>Course</label>
                            <span id="course"></span>
                        </div>
                    </div>
                </div>

                <!-- Enrollment Date -->
                <div class="col-lg-3">
                    <div class="info-item">
                        <div class="info-icon">
                            <i class="bi bi-calendar-check"></i>
                        </div>

                        <div>
                            <label>Enrollment Date</label>
                            <span id="enrollment"></span>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        window.onload = function () {
            let sid = localStorage.getItem("selectedSID");

            if (!sid) {
                alert("No student selected.");
                window.location.href = "API.html";
                return;
            }

            $.ajax({
                url: `http://localhost:3000/students/sid/${sid}`,
                method: 'GET',
                success: function (res) {
                    let s = res.data;

                    document.getElementById("sid").textContent = s.SID;
                    document.getElementById("firstName").textContent = s.FirstName;
                    document.getElementById("lastName").textContent = s.LastName;
                    document.getElementById("email").textContent = s.Email;
                    document.getElementById("phone").textContent = s.Phone;
                    document.getElementById("dob").textContent = s.DateOfBirth;
                    document.getElementById("gender").textContent = s.Gender;
                    document.getElementById("address").textContent = s.Address;
                    document.getElementById("city").textContent = s.NearCity;
                    document.getElementById("course").textContent = s.Course;
                    document.getElementById("enrollment").textContent = s.EnrollmentDate;
                    document.getElementById("guardian").textContent = s.Guardian;
                    document.getElementById("guardianPhone").textContent = s.GuardianPhone;
                },
                error: function () {
                    alert("Failed to load student details.");
                    window.location.href = "API.html";
                }
            });
        }
    </script>

</body>

</html>
